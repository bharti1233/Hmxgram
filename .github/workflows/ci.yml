name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Validate repository hygiene
        run: bash scripts/ci/validate_repo.sh

      - name: Test debug-release cleanup safeguards
        run: bash scripts/ci/test_cleanup_workflow.sh

      - name: Test APK publish gates
        run: bash scripts/ci/test_publish_gates.sh

      - name: Test universal APK packaging gates
        run: bash scripts/ci/test_universal_packaging.sh

      - name: Test patch report verifier
        run: bash scripts/ci/test_patch_report.sh

      - name: Test protected-method verifier
        run: bash scripts/ci/test_protected_methods.sh

      - name: Validate HMX Insta branding
        run: bash scripts/ci/validate_branding.sh

  bundle:
    name: Build patch bundle (.mpp)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 40
    # Secrets are not available to pull requests from forks. Fork PRs still get
    # the validation job; a maintainer can run this workflow manually on a branch.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The action's default package list includes the obsolete "tools"
          # package, which current sdkmanager releases no longer provide.
          cmdline-tools-version: '20.0'
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35 and Build Tools 35.0.0
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME"
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME"
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0'
          bash ./gradlew --version

      - name: Configure Morphe registry credentials
        env:
          MORPHE_USER: ${{ secrets.MORPHE_REGISTRY_USER }}
          MORPHE_TOKEN: ${{ secrets.MORPHE_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MORPHE_USER:-}" ] || [ -z "${MORPHE_TOKEN:-}" ]; then
            echo "::error title=Missing registry credentials::Set repository secrets MORPHE_REGISTRY_USER and MORPHE_REGISTRY_TOKEN (read:packages)."
            exit 1
          fi
          mkdir -p "$HOME/.gradle"
          umask 077
          {
            printf 'gpr.user=%s\n' "$MORPHE_USER"
            printf 'gpr.key=%s\n' "$MORPHE_TOKEN"
          } > "$HOME/.gradle/gradle.properties"

      - name: Build patch bundle
        run: |
          set -o pipefail
          bash ./gradlew :patches:build --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Validate bundle artifact
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find patches/build/libs -maxdepth 1 -type f -name 'patches-*.mpp' ! -name '*-sources*' ! -name '*-javadoc*')
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .mpp bundle, found ${#bundles[@]}"
            printf '%s\n' "${bundles[@]}"
            exit 1
          fi
          bundle="${bundles[0]}"
          test -s "$bundle"
          file "$bundle"
          sha256sum "$bundle" | tee "$bundle.sha256"
          echo "MPP=$bundle" >> "$GITHUB_ENV"

      - name: Write job summary
        if: success()
        run: |
          {
            echo "## Patch bundle build"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- JDK: \`$(java -version 2>&1 | head -1)\`"
            echo "- Bundle: \`${MPP}\`"
            echo "- SHA-256:"
            echo '```'
            cat "${MPP}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload patch bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patch-bundle
          path: |
            ${{ env.MPP }}
            ${{ env.MPP }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Remove registry credentials
        if: always()
        run: rm -f "$HOME/.gradle/gradle.properties"
