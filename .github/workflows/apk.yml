name: APK build (gated)

# Manual, reviewed APK build.
#
# Security properties enforced by this workflow:
#   - Runs only from an exact allowlisted ref: refs/heads/main or the single v2
#     milestone branch, and only through the apk-build environment, which has a
#     required reviewer.
#   - The environment branch policy must allow the same exact refs; a ref that
#     is not allowlisted here never reaches the environment or its secrets.
#   - The base APK is pinned by immutable asset URL + SHA-256 and is re-checked
#     for package, version, and Meta signing certificate before patching.
#   - The Instagram signature-check bypass is disabled unless explicitly
#     requested, and a release-signed build can never enable it.
#   - A throwaway-signed test build is labelled with a -test suffix.
#   - A release build must prove its output signer matches RELEASE_CERT_SHA256.
#   - The patched APK is NOT uploaded as an artifact. Only a text report is.
#     Do not enable APK upload until a verified private distribution channel
#     exists; Actions artifacts in a public repository are not private storage.
#   - The private-asset token must be fine-grained (Contents: Read on the input
#     repository). A broad classic PAT is rejected at runtime.
#
# Do not put a stock Instagram APK, a patched APK, a keystore, or a token in
# the repository. The downloaded base APK is deleted at the end of the job.

on:
  workflow_dispatch:
    inputs:
      instagram_version:
        description: Exact Instagram version of the base APK (must match the pinned verified base)
        required: true
        type: string
      base_apk_kind:
        description: Base input format
        required: true
        default: apk
        type: choice
        options:
          - apk
          - apkm
          - xapk
          - apks
      clone:
        description: Build the side-by-side clone package (com.instagram.android.feurstagram)
        required: true
        default: false
        type: boolean
      allow_throwaway_signature:
        description: Sign with a throwaway test key (test artifacts only; never for release)
        required: true
        default: false
        type: boolean
      allow_signature_bypass:
        description: Apply the Instagram signature-check bypass (test builds only; requires allow_throwaway_signature)
        required: true
        default: false
        type: boolean
      publish_test_apk:
        description: Publish the throwaway-signed APK to the private input repo as a debug-test-<run>-<attempt> prerelease
        required: true
        default: false
        type: boolean
      enable_downloader:
        description: Apply the downloader's own default-off patches (the share target and the media observer). The patch report must then list them
        required: true
        default: false
        type: boolean
      enable_ghost:
        description: Apply the default-off "Ghost Mode settings" patch (the privacy screen). The patch report must then list it
        required: true
        default: false
        type: boolean
      enable_incontext:
        description: Apply the default-off "In-context download actions" patch (the HMX download chip over feed, reels and stories). Implies enable_downloader and must be listed in the patch report
        required: true
        default: false
        type: boolean
      run_install_test:
        description: Run an adb install smoke test on an attached arm64 API 35 device (GitHub-hosted runners have none; leave false and the device test is reported as pending)
        required: true
        default: false
        type: boolean
      disable_patches:
        description: Comma-separated patch names to skip (for example, "Quoicouview mode")
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build patched APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Hard guard in addition to the environment branch policy. Keep this an
    # exact allowlist: never a prefix or wildcard. Milestone builds run from
    # feature/hmx-downloader-ghost-mode-v2; everything else is rejected before
    # the environment is requested.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/feature/hmx-downloader-ghost-mode-v2'
    environment: apk-build
    env:
      EXPECTED_INSTAGRAM_PACKAGE: com.instagram.android
      EXPECTED_INSTAGRAM_VERSION: 454.0.0.54.77
      EXPECTED_INSTAGRAM_VERSION_CODE: '386014712'
      EXPECTED_META_CERT_SHA256: 3a10c50c18ba937506c2875e9047be74f8fd8b86fae2ff9feaa50a81fcb4c014
      MIN_RES_ENTRIES: '12000'
      MIN_APPLIED_PATCHES: '14'
      EXPECTED_PATCHES: 'Force SDR display,Feed item filtering,Limit feed to following profiles,Network content blocking,Suggested accounts in the story tray,Quoicouview assets,Quoicouview mode,Restart relay,Hidden Home in Back history,Settings entry point,Notes tray,Popup hiding,Install-packages permission,HMX Insta app name'
      # The reviewed M2 build adds one more default-off patch. The expectation
      # switches to this list only when enable_downloader is true, so an
      # ordinary build still has to pass the unchanged 14-patch expectation.
      EXPECTED_PATCHES_WITH_DOWNLOADER: 'Force SDR display,Feed item filtering,Limit feed to following profiles,Network content blocking,Suggested accounts in the story tray,Quoicouview assets,Quoicouview mode,Restart relay,Hidden Home in Back history,Settings entry point,Notes tray,Popup hiding,Install-packages permission,HMX Insta app name,Downloader share target,Downloader media observer'
      EXPECTED_PATCHES_WITH_GHOST: 'Force SDR display,Feed item filtering,Limit feed to following profiles,Network content blocking,Suggested accounts in the story tray,Quoicouview assets,Quoicouview mode,Restart relay,Hidden Home in Back history,Settings entry point,Notes tray,Popup hiding,Install-packages permission,HMX Insta app name,Downloader share target,Downloader media observer,Ghost Mode settings'
      EXPECTED_PATCHES_WITH_INCONTEXT: 'Force SDR display,Feed item filtering,Limit feed to following profiles,Network content blocking,Suggested accounts in the story tray,Quoicouview assets,Quoicouview mode,Restart relay,Hidden Home in Back history,Settings entry point,Notes tray,Popup hiding,Install-packages permission,HMX Insta app name,Downloader share target,Downloader media observer,In-context download actions'
      EXPECTED_PATCHES_WITH_INCONTEXT_GHOST: 'Force SDR display,Feed item filtering,Limit feed to following profiles,Network content blocking,Suggested accounts in the story tray,Quoicouview assets,Quoicouview mode,Restart relay,Hidden Home in Back history,Settings entry point,Notes tray,Popup hiding,Install-packages permission,HMX Insta app name,Downloader share target,Downloader media observer,In-context download actions,Ghost Mode settings'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The action's default package list includes the obsolete "tools"
          # package, which current sdkmanager releases no longer provide.
          cmdline-tools-version: '20.0'
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK 35 and Build Tools 35.0.0
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Add Android build tools to PATH
        run: echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME"
          printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME"
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0'
          bash ./gradlew --version

      - name: Validate required inputs and secrets
        env:
          BASE_APK_URL: ${{ secrets.BASE_APK_URL }}
          BASE_APK_SHA256: ${{ secrets.BASE_APK_SHA256 }}
          BASE_APK_TOKEN: ${{ secrets.BASE_APK_TOKEN }}
          MORPHE_CLI_URL: ${{ secrets.MORPHE_CLI_URL }}
          MORPHE_CLI_SHA256: ${{ secrets.MORPHE_CLI_SHA256 }}
          MORPHE_USER: ${{ secrets.MORPHE_REGISTRY_USER }}
          MORPHE_TOKEN: ${{ secrets.MORPHE_REGISTRY_TOKEN }}
          INSTAGRAM_VERSION: ${{ inputs.instagram_version }}
          BASE_APK_KIND: ${{ inputs.base_apk_kind }}
          ALLOW_THROWAWAY: ${{ inputs.allow_throwaway_signature }}
          ALLOW_SIGNATURE_BYPASS: ${{ inputs.allow_signature_bypass }}
          PUBLISH_TEST_APK: ${{ inputs.publish_test_apk }}
          ENABLE_DOWNLOADER: ${{ inputs.enable_downloader }}
          ENABLE_GHOST: ${{ inputs.enable_ghost }}
          ENABLE_INCONTEXT: ${{ inputs.enable_incontext }}
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
          HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          for name in BASE_APK_URL BASE_APK_SHA256 MORPHE_CLI_URL MORPHE_CLI_SHA256 MORPHE_USER MORPHE_TOKEN; do
            value="${!name:-}"
            [ -n "$value" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error title=Missing APK build secrets::%s\n' "Missing: ${missing[*]}"
            exit 1
          fi
          case "$BASE_APK_URL" in
            https://*) ;;
            *) echo "::error::BASE_APK_URL must use https://"; exit 1 ;;
          esac
          case "$MORPHE_CLI_URL" in
            https://*) ;;
            *) echo "::error::MORPHE_CLI_URL must use https://"; exit 1 ;;
          esac
          [[ "$BASE_APK_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "::error::BASE_APK_SHA256 must be a 64-character hex digest"
            exit 1
          }
          [[ "$MORPHE_CLI_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "::error::MORPHE_CLI_SHA256 must be a 64-character hex digest"
            exit 1
          }
          [[ "$INSTAGRAM_VERSION" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::instagram_version contains unsupported characters"
            exit 1
          }
          case "$BASE_APK_KIND" in
            apk|apkm|xapk|apks) ;;
            *) echo "::error::unsupported base_apk_kind"; exit 1 ;;
          esac

          # Signature-check bypass policy: test builds only, never release.
          if [ "$ALLOW_SIGNATURE_BYPASS" = "true" ]; then
            if [ "$ALLOW_THROWAWAY" != "true" ]; then
              echo "::error title=Signature bypass requires test signing::allow_signature_bypass may only be used together with allow_throwaway_signature=true."
              exit 1
            fi
            if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
              echo "::error title=Signature bypass forbidden for release::A release keystore is configured, so this build is a release build and must not enable the signature-check bypass."
              exit 1
            fi
            echo "::warning::Signature-check bypass requested. This weakens Instagram's integrity checks and is allowed only for test builds."
          elif [ "$ALLOW_THROWAWAY" = "true" ] && [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            echo "::error title=Ambiguous signing mode::A release keystore is configured, so allow_throwaway_signature must be false."
            exit 1
          fi

          if [ "$HAS_RELEASE_KEYSTORE" = "true" ]; then
            [[ "${RELEASE_CERT_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]] || {
              echo "::error title=Missing release certificate pin::Set the apk-build environment secret RELEASE_CERT_SHA256 to the expected release signing certificate SHA-256."
              exit 1
            }
          fi

          # Debug-publishing policy: test signing only, throwaway-only, separate token.
          if [ "$PUBLISH_TEST_APK" = "true" ]; then
            [ "$ALLOW_THROWAWAY" = "true" ] || {
              echo "::error title=Publish requires test signing::publish_test_apk requires allow_throwaway_signature=true."
              exit 1
            }
            [ -n "${DIST_TOKEN:-}" ] || {
              echo "::error title=Missing DIST_TOKEN::Set DIST_TOKEN as an apk-build environment secret (Contents: Read and write on bharti1233/hmx-build-inputs)."
              exit 1
            }
            [ "${DIST_TOKEN}" != "${BASE_APK_TOKEN:-}" ] || {
              echo "::error title=Token separation::DIST_TOKEN must be a different token from BASE_APK_TOKEN."
              exit 1
            }
          fi

          # The downloader share target is default-off in the patch source. A
          # build that asks for it must therefore expect it in the patch report,
          # and a build that does not ask for it must not contain it. The
          # in-context action sits on top of the downloader and implies it.
          if [ "$ENABLE_GHOST" = "true" ] && [ "$ENABLE_INCONTEXT" = "true" ]; then
            echo "EXPECTED_PATCHES=$EXPECTED_PATCHES_WITH_INCONTEXT_GHOST" >> "$GITHUB_ENV"
            echo "MIN_APPLIED_PATCHES=18" >> "$GITHUB_ENV"
            echo "::notice::The in-context download action and Ghost Mode patches are enabled for this build."
          elif [ "$ENABLE_GHOST" = "true" ]; then
            echo "EXPECTED_PATCHES=$EXPECTED_PATCHES_WITH_GHOST" >> "$GITHUB_ENV"
            echo "MIN_APPLIED_PATCHES=17" >> "$GITHUB_ENV"
            echo "::notice::The Ghost Mode settings patch is enabled for this build."
          elif [ "$ENABLE_INCONTEXT" = "true" ]; then
            echo "EXPECTED_PATCHES=$EXPECTED_PATCHES_WITH_INCONTEXT" >> "$GITHUB_ENV"
            echo "MIN_APPLIED_PATCHES=17" >> "$GITHUB_ENV"
            echo "::notice::The in-context download action is enabled for this build."
          elif [ "$ENABLE_DOWNLOADER" = "true" ]; then
            echo "EXPECTED_PATCHES=$EXPECTED_PATCHES_WITH_DOWNLOADER" >> "$GITHUB_ENV"
            echo "MIN_APPLIED_PATCHES=16" >> "$GITHUB_ENV"
            echo "::notice::The downloader patches are enabled for this build."
          fi

      - name: Enforce least-privilege private-asset token
        env:
          BASE_APK_TOKEN: ${{ secrets.BASE_APK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_APK_TOKEN:-}" ]; then
            echo "::error title=Missing BASE_APK_TOKEN::Set BASE_APK_TOKEN as an apk-build environment secret."
            exit 1
          fi
          headers="$(mktemp)"
          chmod 600 "$headers"
          trap 'rm -f "$headers"' EXIT
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            -D "$headers" -o /dev/null \
            -H "Authorization: Bearer $BASE_APK_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: hmx-ci" \
            https://api.github.com/user
          scopes="$(tr -d '\r' < "$headers" | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes:[[:space:]]*//p' | head -1)"
          rm -f "$headers"
          if [ -n "$scopes" ]; then
            echo "Classic token scopes detected: $scopes"
            case ",$scopes," in
              *,repo,*|*,workflow,*|*,write:packages,*|*,delete_repo,*|*,admin:*|*,packages:write,*)
                echo "::error title=Over-privileged asset token::BASE_APK_TOKEN is a classic PAT with broad scopes. Replace it with a fine-grained token limited to Contents: Read on the private input repository."
                exit 1
                ;;
            esac
          else
            echo "::notice::BASE_APK_TOKEN has no classic scope header (fine-grained or app token)."
          fi

      - name: Download stock Instagram APK
        env:
          BASE_APK_URL: ${{ secrets.BASE_APK_URL }}
          BASE_APK_SHA256: ${{ secrets.BASE_APK_SHA256 }}
          BASE_APK_TOKEN: ${{ secrets.BASE_APK_TOKEN }}
          BASE_APK_KIND: ${{ inputs.base_apk_kind }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hmx-input"
          out="$RUNNER_TEMP/hmx-input/instagram.$BASE_APK_KIND"
          header="$RUNNER_TEMP/hmx-input/base-apk-auth.header"
          # Private GitHub release assets must be fetched through the API asset
          # URL with Accept: application/octet-stream. The public
          # github.com/.../releases/download/... URL returns 404 even with a
          # bearer token when the repository is private.
          if [ -n "${BASE_APK_TOKEN:-}" ]; then
            {
              printf 'Authorization: Bearer %s\n' "$BASE_APK_TOKEN"
              printf 'Accept: application/octet-stream\n'
            } > "$header"
            chmod 600 "$header"
            curl --fail --location --retry 3 --retry-delay 5 \
              --proto '=https' --tlsv1.2 --max-time 900 \
              --silent --show-error -H @"$header" -o "$out" "$BASE_APK_URL"
            rm -f "$header"
          else
            curl --fail --location --retry 3 --retry-delay 5 \
              --proto '=https' --tlsv1.2 --max-time 900 \
              --silent --show-error -H 'Accept: application/octet-stream' \
              -o "$out" "$BASE_APK_URL"
          fi
          printf '%s  %s\n' "$BASE_APK_SHA256" "$out" | sha256sum -c -
          echo "BASE_APK=$out" >> "$GITHUB_ENV"

      - name: Validate input and verify base identity
        env:
          BASE_APK_KIND: ${{ inputs.base_apk_kind }}
          REQUESTED_VERSION: ${{ inputs.instagram_version }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED_VERSION" != "$EXPECTED_INSTAGRAM_VERSION" ]; then
            echo "::error title=Version mismatch::instagram_version must be $EXPECTED_INSTAGRAM_VERSION, the pinned and verified base."
            exit 1
          fi

          if [ "$BASE_APK_KIND" = "apk" ]; then
            echo "==> Single APK input: rejecting bundle-derived base APKs"
            bash scripts/ci/validate_input_apk.sh "$BASE_APK"
            identity_apk="$BASE_APK"
          else
            echo "==> Split bundle input: validating completeness before merge"
            bash scripts/ci/validate_bundle.sh "$BASE_APK" \
              --extract-base "$RUNNER_TEMP/hmx-input/base.apk" \
              --report "$RUNNER_TEMP/bundle-validation.txt"
            identity_apk="$RUNNER_TEMP/hmx-input/base.apk"
            echo "BUNDLE_BASE_APK=$identity_apk" >> "$GITHUB_ENV"
          fi

          badging="$(aapt dump badging "$identity_apk")"
          printf '%s\n' "$badging" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code:|^densities:" || true
          printf '%s\n' "$badging" | grep -qF "package: name='$EXPECTED_INSTAGRAM_PACKAGE'" || {
            echo "::error title=Wrong package::Base input is not $EXPECTED_INSTAGRAM_PACKAGE."
            exit 1
          }
          actual_version="$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          actual_code="$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          if [ "$actual_version" != "$EXPECTED_INSTAGRAM_VERSION" ]; then
            echo "::error title=Wrong version::Base input is $actual_version, expected $EXPECTED_INSTAGRAM_VERSION."
            exit 1
          fi
          if [ "$actual_code" != "$EXPECTED_INSTAGRAM_VERSION_CODE" ]; then
            echo "::error title=Wrong version code::Base input is versionCode $actual_code, expected $EXPECTED_INSTAGRAM_VERSION_CODE."
            exit 1
          fi

          certs="$(apksigner verify --print-certs "$identity_apk")"
          printf '%s\n' "$certs" | grep -E "certificate (DN|SHA-256 digest):" || true
          printf '%s\n' "$certs" | grep -qi "certificate SHA-256 digest: $EXPECTED_META_CERT_SHA256" || {
            echo "::error title=Unexpected base signer::Base input does not carry the expected Meta certificate $EXPECTED_META_CERT_SHA256."
            exit 1
          }
          echo "::notice::Base input verified: $EXPECTED_INSTAGRAM_PACKAGE $EXPECTED_INSTAGRAM_VERSION ($EXPECTED_INSTAGRAM_VERSION_CODE) with the expected Meta signing certificate."

      - name: Download pinned Morphe CLI
        env:
          MORPHE_CLI_URL: ${{ secrets.MORPHE_CLI_URL }}
          MORPHE_CLI_SHA256: ${{ secrets.MORPHE_CLI_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p tools
          cli="tools/morphe-cli-pinned.jar"
          curl --fail --location --retry 3 --retry-delay 5 \
            --proto '=https' --tlsv1.2 --max-time 600 \
            --silent --show-error -o "$cli" "$MORPHE_CLI_URL"
          printf '%s  %s\n' "$MORPHE_CLI_SHA256" "$cli" | sha256sum -c -
          file "$cli"

      - name: Download APKEditor for split bundles
        env:
          APKEDITOR_URL: ${{ secrets.APKEDITOR_URL }}
          APKEDITOR_SHA256: ${{ secrets.APKEDITOR_SHA256 }}
          BASE_APK_KIND: ${{ inputs.base_apk_kind }}
        run: |
          set -euo pipefail
          if [ "$BASE_APK_KIND" = "apk" ]; then
            echo "Single APK input; APKEditor not required."
            exit 0
          fi
          if [ -z "${APKEDITOR_URL:-}" ] || [ -z "${APKEDITOR_SHA256:-}" ]; then
            echo "::error title=Missing APKEditor::Split bundles require APKEDITOR_URL and APKEDITOR_SHA256 secrets."
            exit 1
          fi
          editor="tools/APKEditor-pinned.jar"
          curl --fail --location --retry 3 --retry-delay 5 \
            --proto '=https' --tlsv1.2 --max-time 600 \
            --silent --show-error -o "$editor" "$APKEDITOR_URL"
          printf '%s  %s\n' "$APKEDITOR_SHA256" "$editor" | sha256sum -c -

      - name: Configure Morphe registry credentials
        env:
          MORPHE_USER: ${{ secrets.MORPHE_REGISTRY_USER }}
          MORPHE_TOKEN: ${{ secrets.MORPHE_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          umask 077
          {
            printf 'gpr.user=%s\n' "$MORPHE_USER"
            printf 'gpr.key=%s\n' "$MORPHE_TOKEN"
          } > "$HOME/.gradle/gradle.properties"

      - name: Prepare signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ALLOW_THROWAWAY: ${{ inputs.allow_throwaway_signature }}
          ALLOW_SIGNATURE_BYPASS: ${{ inputs.allow_signature_bypass }}
        run: |
          set -euo pipefail
          if [ "${ALLOW_SIGNATURE_BYPASS:-false}" = "true" ] && [ "${ALLOW_THROWAWAY:-false}" != "true" ]; then
            echo "::error::allow_signature_bypass requires allow_throwaway_signature=true."
            exit 1
          fi
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            if [ "${ALLOW_SIGNATURE_BYPASS:-false}" = "true" ]; then
              echo "::error::Signature-check bypass is forbidden in a release build."
              exit 1
            fi
            if [ -z "${KEYSTORE_PASS:-}" ]; then
              echo "::error::RELEASE_KEYSTORE_PASS is required when RELEASE_KEYSTORE_BASE64 is set."
              exit 1
            fi
            ks="$RUNNER_TEMP/hmx-input/release.keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ks"
            chmod 600 "$ks"
            echo "FEURSTAGRAM_KEYSTORE=$ks" >> "$GITHUB_ENV"
            echo "FEURSTAGRAM_KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "FEURSTAGRAM_KEY_PASS=${KEY_PASS:-$KEYSTORE_PASS}" >> "$GITHUB_ENV"
            echo "FEURSTAGRAM_KEY_ALIAS=${KEY_ALIAS:-feurstagram}" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
          elif [ "${ALLOW_THROWAWAY:-false}" = "true" ]; then
            echo "SIGNING_MODE=throwaway" >> "$GITHUB_ENV"
            echo "::warning::No release keystore configured; using a throwaway key. This artifact is for testing only and is labelled -test."
          else
            echo "::error title=Missing signing material::Set RELEASE_KEYSTORE_BASE64/RELEASE_KEYSTORE_PASS or enable allow_throwaway_signature."
            exit 1
          fi
          echo "SIGNATURE_BYPASS=${ALLOW_SIGNATURE_BYPASS:-false}" >> "$GITHUB_ENV"

      - name: Build patch bundle
        run: |
          set -o pipefail
          bash ./gradlew :patches:build --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/apk-build.log"

      - name: Patch and sign APK
        env:
          CLONE: ${{ inputs.clone }}
          ALLOW_SIGNATURE_BYPASS: ${{ inputs.allow_signature_bypass }}
          ENABLE_DOWNLOADER: ${{ inputs.enable_downloader }}
          ENABLE_GHOST: ${{ inputs.enable_ghost }}
          ENABLE_INCONTEXT: ${{ inputs.enable_incontext }}
          DISABLE_PATCHES: ${{ inputs.disable_patches }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ "${SIGNING_MODE:-}" = "release" ]; then
            export EXPECTED_APK_SIGNER_SHA256="${RELEASE_CERT_SHA256:-}"
          fi
          args=("$BASE_APK")
          if [ "$CLONE" = "true" ]; then
            args+=(--clone)
          fi
          if [ "$ALLOW_SIGNATURE_BYPASS" = "true" ]; then
            args+=(--allow-signature-bypass)
          fi
          if [ "${ENABLE_DOWNLOADER:-false}" = "true" ]; then
            args+=(--downloader)
          fi
          if [ "${ENABLE_INCONTEXT:-false}" = "true" ]; then
            args+=(--incontext)
          fi
          if [ "${ENABLE_GHOST:-false}" = "true" ]; then
            args+=(--ghost)
          fi
          bash ./build.sh "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/apk-build.log"

      - name: Validate final standalone packaging
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
          CLONE: ${{ inputs.clone }}
        run: |
          set -euo pipefail
          if [ "$CLONE" = "true" ]; then
            expected_pkg="com.instagram.android.feurstagram"
          else
            expected_pkg="com.instagram.android"
          fi
          args=(--stage final --expected-package "$expected_pkg" --report "$RUNNER_TEMP/standalone-validation.txt")
          if [ "${SIGNING_MODE:-}" = "release" ]; then
            args+=(--expected-signer "$RELEASE_CERT_SHA256")
          fi
          bash scripts/ci/validate_standalone_apk.sh "${args[@]}" feurstagram.apk
          cat "$RUNNER_TEMP/standalone-validation.txt"

      - name: Verify APK
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
          REQUESTED_VERSION: ${{ inputs.instagram_version }}
          CLONE: ${{ inputs.clone }}
        run: |
          set -euo pipefail
          test -s feurstagram.apk
          certs="$(apksigner verify --print-certs feurstagram.apk)"
          printf '%s\n' "$certs" | tee "$RUNNER_TEMP/apk-certs.txt"
          sha256sum feurstagram.apk | tee feurstagram.apk.sha256

          case "${SIGNING_MODE:-}" in
            release)
              [[ "${RELEASE_CERT_SHA256:-}" =~ ^[0-9a-fA-F]{64}$ ]] || {
                echo "::error title=Missing release certificate pin::Set RELEASE_CERT_SHA256."
                exit 1
              }
              printf '%s\n' "$certs" | grep -qi "certificate SHA-256 digest: $RELEASE_CERT_SHA256" || {
                echo "::error title=Unexpected release signer::The patched APK is not signed by the pinned release certificate."
                exit 1
              }
              echo "::notice::Release signing certificate matches RELEASE_CERT_SHA256."
              ;;
            throwaway)
              echo "::warning::Throwaway signature: this APK is a test artifact and is not for distribution."
              ;;
            *)
              echo "::error title=Unknown signing mode::SIGNING_MODE is not set."
              exit 1
              ;;
          esac

          version="$(printf '%s' "$REQUESTED_VERSION" | tr -cd 'A-Za-z0-9._-')"
          [ -n "$version" ] || { echo "::error::empty instagram_version"; exit 1; }
          suffix=""
          if [ "$CLONE" = "true" ]; then suffix="-clone"; fi
          if [ "${SIGNING_MODE}" = "throwaway" ]; then suffix="${suffix}-test"; fi
          out="hmx-insta-${version}${suffix}.apk"
          cp feurstagram.apk "$out"
          sha256sum "$out" > "$out.sha256"
          signer="$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          [[ "$signer" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "::error title=Unparseable signer::apksigner did not report a signer SHA-256 digest"
            exit 1
          }
          echo "APK_OUT=$out" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum feurstagram.apk | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "APK_CERT_SHA256=$signer" >> "$GITHUB_ENV"

      - name: Verify protected Instagram methods
        env:
          BASE_APK_TOKEN: ${{ secrets.BASE_APK_TOKEN }}
          DIST_REPO: bharti1233/hmx-build-inputs
          PROTECTED_TAG: hmx-baseline-454-verified
          PROTECTED_ASSET: hmx-insta-454.0.0.54.77-test.apk
        run: |
          set -euo pipefail
          bash scripts/ci/test_protected_methods.sh

          mkdir -p "$RUNNER_TEMP/hmx-baseline"
          auth="$RUNNER_TEMP/baseline-auth.header"
          umask 077
          printf 'Authorization: Bearer %s\n' "$BASE_APK_TOKEN" > "$auth"
          trap 'rm -f "$auth"' EXIT
          api="https://api.github.com/repos/$DIST_REPO"

          # Fail closed if the frozen reference is missing or was tampered with:
          # the verifier also checks the manifest pin against these exact bytes.
          release="$(curl -sS --fail -H @"$auth" \
            -H 'Accept: application/vnd.github+json' \
            "$api/releases/tags/$PROTECTED_TAG")"
          asset_url="$(printf '%s' "$release" | jq -r \
            --arg name "$PROTECTED_ASSET" \
            '.assets[] | select(.name == $name) | .url' | head -1)"
          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "::error title=Missing protected baseline::Release $DIST_REPO@$PROTECTED_TAG has no asset $PROTECTED_ASSET."
            exit 1
          fi
          curl --fail --location --retry 3 --retry-delay 5 \
            --proto '=https' --tlsv1.2 --max-time 600 --silent --show-error \
            -H @"$auth" -H 'Accept: application/octet-stream' \
            -o "$RUNNER_TEMP/hmx-baseline/baseline.apk" "$asset_url"

          python3 scripts/ci/verify_protected_methods.py \
            --manifest scripts/ci/protected_methods.json \
            --baseline "$RUNNER_TEMP/hmx-baseline/baseline.apk" \
            --candidate "$APK_OUT" \
            --report "$RUNNER_TEMP/protected-methods-report.json"
          rm -rf "$RUNNER_TEMP/hmx-baseline"

      - name: Install smoke test on arm64 Android 15
        if: inputs.run_install_test
        env:
          CLONE: ${{ inputs.clone }}
          EXPECTED_PACKAGE: com.instagram.android
        run: |
          set -euo pipefail
          if [ "$CLONE" = "true" ]; then
            export EXPECTED_PACKAGE=com.instagram.android.feurstagram
          fi
          bash scripts/ci/install_smoke_test.sh "$APK_OUT"

      - name: Publish throwaway test APK to private input repo
        if: inputs.publish_test_apk
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
          BASE_APK_TOKEN: ${{ secrets.BASE_APK_TOKEN }}
          DIST_REPO: bharti1233/hmx-build-inputs
          PROTECTED_TAG: Apk-input-original
          PUBLISH_TAG: debug-test-${{ github.run_id }}-${{ github.run_attempt }}
          REQUESTED_VERSION: ${{ inputs.instagram_version }}
          CLONE: ${{ inputs.clone }}
          ENABLE_DOWNLOADER: ${{ inputs.enable_downloader }}
          ENABLE_GHOST: ${{ inputs.enable_ghost }}
          ENABLE_INCONTEXT: ${{ inputs.enable_incontext }}
          EXPECTED_PACKAGE: com.instagram.android
        run: |
          set -euo pipefail

          # Policy gates: throwaway-only, bypass off, distinct token, guarded tag.
          [ "${SIGNING_MODE}" = "throwaway" ] || {
            echo "::error::Only throwaway test builds may be published"; exit 1; }
          [ "${SIGNATURE_BYPASS:-false}" != "true" ] || {
            echo "::error::Refusing to publish with signature bypass enabled"; exit 1; }
          [ -n "${DIST_TOKEN:-}" ] || {
            echo "::error::DIST_TOKEN is not configured"; exit 1; }
          [ "${DIST_TOKEN}" != "${BASE_APK_TOKEN:-}" ] || {
            echo "::error::DIST_TOKEN must be distinct from BASE_APK_TOKEN"; exit 1; }
          [ "${PUBLISH_TAG}" != "${PROTECTED_TAG}" ] || {
            echo "::error::Refusing to use the protected tag"; exit 1; }
          [[ "${PUBLISH_TAG}" =~ ^debug-test-[0-9]+-[0-9]+$ ]] || {
            echo "::error::Publish tag does not match debug-test-<run>-<attempt>"; exit 1; }

          # The published bytes must carry what the build was asked for: when
          # the downloader share target was enabled, the patch report has to
          # list it, so a build that silently skipped it is never published.
          if [ "${ENABLE_DOWNLOADER:-false}" = "true" ]; then
            grep -qF 'Downloader share target' build/patch-report.json || {
              echo "::error::The patch report does not list the Downloader share target patch"; exit 1; }
            grep -qF 'Downloader media observer' build/patch-report.json || {
              echo "::error::The patch report does not list the Downloader media observer patch"; exit 1; }
          fi
          if [ "${ENABLE_INCONTEXT:-false}" = "true" ]; then
            grep -qF 'In-context download actions' build/patch-report.json || {
              echo "::error::The patch report does not list the In-context download actions patch"; exit 1; }
          fi
          if [ "${ENABLE_GHOST:-false}" = "true" ]; then
            grep -qF 'Ghost Mode settings' build/patch-report.json || {
              echo "::error::The patch report does not list the Ghost Mode settings patch"; exit 1; }
          fi

          # Verify the exact bytes and signer against the locally generated build report.
          sha256sum -c feurstagram.apk.sha256
          reported_cert="$(grep -i 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apk-certs.txt" | head -1 | awk '{print $NF}')"
          [ "$reported_cert" = "$APK_CERT_SHA256" ] || {
            echo "::error::Build report signer does not match the verified signer"; exit 1; }
          fresh_cert="$(apksigner verify --print-certs "$APK_OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)"
          [ "$fresh_cert" = "$reported_cert" ] || {
            echo "::error::APK signer changed after verification"; exit 1; }
          actual_sha="$(sha256sum "$APK_OUT" | awk '{print $1}')"
          [ "$actual_sha" = "$APK_SHA256" ] || {
            echo "::error::APK digest changed after verification"; exit 1; }

          # Verify the bytes about to be published identify as the expected app.
          expected_pkg="$EXPECTED_PACKAGE"
          if [ "${CLONE:-false}" = "true" ]; then
            expected_pkg="com.instagram.android.feurstagram"
          fi
          # Defense in depth: re-validate the exact bytes about to be published.
          bash scripts/ci/validate_standalone_apk.sh --stage final \
            --expected-package "$expected_pkg" \
            --expected-version "$REQUESTED_VERSION" \
            "$APK_OUT"
          badging="$(aapt dump badging "$APK_OUT")"
          printf '%s\n' "$badging" | grep -qF "package: name='$expected_pkg'" || {
            echo "::error::APK package is not $expected_pkg"; exit 1; }
          published_version="$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          [ "$published_version" = "$REQUESTED_VERSION" ] || {
            echo "::error::APK version is '${published_version:-unknown}', expected '$REQUESTED_VERSION'"; exit 1; }

          auth="$RUNNER_TEMP/dist-auth.header"
          umask 077
          printf 'Authorization: Bearer %s\n' "$DIST_TOKEN" > "$auth"
          trap 'rm -f "$auth"' EXIT
          api="https://api.github.com/repos/$DIST_REPO"

          # Never overwrite: abort if the release tag already exists.
          if [ "$(curl -sS -o /dev/null -w '%{http_code}' -H @"$auth" "$api/releases/tags/$PUBLISH_TAG")" = "200" ]; then
            echo "::error::Release $PUBLISH_TAG already exists; refusing to overwrite"
            exit 1
          fi

          body="$(printf 'Debug test build (throwaway signature)\n\n- Instagram version: %s\n- Commit: %s\n- Run: %s/%s/actions/runs/%s\n- APK SHA-256: %s\n- Signer (throwaway): %s\n- Signature bypass: disabled\n- Retention: deleted 72h after creation\n\nTHROWAWAY KEY - TEST ONLY - NOT FOR DISTRIBUTION' \
            "$REQUESTED_VERSION" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$APK_SHA256" "$APK_CERT_SHA256")"
          payload="$(jq -n --arg t "$PUBLISH_TAG" \
            --arg n "HMX Insta debug $REQUESTED_VERSION (run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT)" \
            --arg b "$body" \
            '{tag_name:$t,name:$n,body:$b,prerelease:true,draft:false,make_latest:"false"}')"
          rid="$(curl -sS --fail -X POST -H @"$auth" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' "$api/releases" -d "$payload" | jq -r .id)"

          response="$(curl -sS --fail -X POST -H @"$auth" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary @"$APK_OUT" \
            "https://uploads.github.com/repos/$DIST_REPO/releases/$rid/assets?name=$APK_OUT")"
          server_digest="$(printf '%s' "$response" | jq -r '.digest // empty')"
          if [ "$server_digest" != "sha256:$APK_SHA256" ]; then
            echo "::error::Uploaded asset digest mismatch (server=${server_digest:-none}); rolling back"
            curl -sS -o /dev/null -X DELETE -H @"$auth" "$api/releases/$rid" || true
            exit 1
          fi

          echo "PUBLISHED_TAG=$PUBLISH_TAG" >> "$GITHUB_ENV"
          echo "::notice::Published $APK_OUT as $DIST_REPO@$PUBLISH_TAG"

      - name: Write job summary
        if: success()
        env:
          REQUESTED_VERSION: ${{ inputs.instagram_version }}
          CLONE: ${{ inputs.clone }}
          RUN_INSTALL_TEST: ${{ inputs.run_install_test }}
        run: |
          {
            echo "## Gated APK build"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Instagram version (verified against base): \`${REQUESTED_VERSION}\`"
            echo "- Base input kind: \`${{ inputs.base_apk_kind }}\`"
            echo "- Clone package: \`${CLONE}\`"
            if [ "${{ inputs.enable_downloader }}" = "true" ]; then
              echo "- Downloader patches: **ENABLED** (the patch report must list the share target and the media observer)"
            else
              echo "- Downloader patches: **disabled** (default-off patches, not applied)"
            fi
            if [ "${{ inputs.enable_incontext }}" = "true" ]; then
              echo "- In-context download actions: **ENABLED** (HMX chip over feed, reels and stories; the patch report must list it)"
            else
              echo "- In-context download actions: **disabled** (default-off patch, not applied)"
            fi
            case "${SIGNING_MODE:-}" in
              release) echo "- Signing mode: **release keystore** (certificate pinned by \`RELEASE_CERT_SHA256\`)" ;;
              throwaway) echo "- Signing mode: **throwaway test key** (test artifact, not for distribution)" ;;
              *) echo "- Signing mode: **unknown**" ;;
            esac
            case "${SIGNATURE_BYPASS:-false}" in
              true) echo "- Signature-check bypass: **ENABLED** (test build only)" ;;
              *) echo "- Signature-check bypass: **disabled**" ;;
            esac
            if [ "${RUN_INSTALL_TEST}" = "true" ]; then
              echo "- Device install test: **passed** on an arm64/API 35 target"
            else
              echo "- Device install test: **not run** (\`run_install_test=false\`); arm64 Android 15 installation remains pending verification"
            fi
            echo "- Standalone packaging: validated (no split metadata, merged density resources)"
            echo "- Protected Instagram methods: verified against \`hmx-baseline-454-verified\` (protected-methods-report.json)"
            echo "- Artifact file: \`${APK_OUT}\`"
            echo "- SHA-256:"
            echo '```'
            cat feurstagram.apk.sha256
            echo '```'
            if [ -n "${PUBLISHED_TAG:-}" ]; then
              echo ""
              echo "- Debug APK release: \`${PUBLISHED_TAG}\` in \`bharti1233/hmx-build-inputs\` (prerelease, deleted 72h after creation)"
              echo "- Download: sign in as the repository owner, open the private repository's Releases page, then install the \`-test\` APK."
              echo "- No APK was uploaded to this public repository."
            else
              echo ""
              echo "The patched APK was **not uploaded**. It exists only on the ephemeral"
              echo "runner and is deleted at the end of the job. Do not enable APK artifact"
              echo "upload until a verified private distribution channel is configured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The patched APK is intentionally NOT uploaded. Actions artifacts on a
      # public repository are not private storage, and this artifact contains
      # proprietary Instagram code. Only the text report below is uploaded.
      # Re-enable APK upload only with a verified private destination.
      - name: Upload text report (no APK)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-build-report
          path: |
            feurstagram.apk.sha256
            feurstagram-*.apk.sha256
            ${{ runner.temp }}/apk-certs.txt
            ${{ runner.temp }}/standalone-validation.txt
            ${{ runner.temp }}/protected-methods-report.json
            ${{ github.workspace }}/build/patch-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apk-build-log
          path: |
            ${{ runner.temp }}/apk-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Remove proprietary input, output, and credentials
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/hmx-input"
          rm -f tools/morphe-cli-pinned.jar tools/APKEditor-pinned.jar
          rm -f "$HOME/.gradle/gradle.properties"
          rm -f "$GITHUB_WORKSPACE"/feurstagram*.apk "$GITHUB_WORKSPACE"/feurstagram.apk.sha256
